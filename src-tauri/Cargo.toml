[package]
name = "qwen-image-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Local Qwen-Image-2.1 with an MCP server for Claude"
license = "MIT"

[lib]
name = "qwen_image_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

rmcp = { version = "3.4", features = [
  "server",
  "macros",
  "schemars",
  "tower",
  "transport-streamable-http-server",
] }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "rustls-native-certs",
] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
hex = "0.4"
zip = "8"
base64 = "0.22"
rand = "0.9"
anyhow = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
